<!DOCTYPE html>
<html lang="ckb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<!-- ARTIFACT:START -->
<title>CRUD From Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ---------------------------------------------------------------------------
   CRUD From Zero — a bilingual classroom manual.
   Palette: cool paper + deep teal ink, an amber reserved for warnings only.
   Type:    Vazirmatn carries both scripts in headings and UI;
            reading text switches face with the script (Naskh / Source Serif).
   --------------------------------------------------------------------------- */

:root {
  --paper:      #f7f9fb;
  --surface:    #ffffff;
  --surface-2:  #eef2f6;
  --ink:        #16202b;
  --ink-soft:   #4a5a6b;
  --ink-faint:  #7d8b99;
  --rule:       #dde5ec;
  --accent:     #0d6e6e;
  --accent-ink: #0a5757;
  --accent-wash:#e2f1f0;
  --warn:       #9c5410;
  --warn-wash:  #fbf1e3;
  --code-bg:    #12303a;
  --code-ink:   #dbe9ee;
  --shadow:     0 1px 2px rgba(18, 40, 56, .06), 0 8px 24px -16px rgba(18, 40, 56, .35);

  --wm-alpha:   .035;
  --rail-w:     16.5rem;
  --measure:    68ch;

  --f-ui:   "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
  --f-ar:   "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
  --f-la:   "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0e141a;
    --surface:    #151d25;
    --surface-2:  #1c262f;
    --ink:        #e4ecf2;
    --ink-soft:   #a6b4c1;
    --ink-faint:  #7d8b99;
    --rule:       #25313c;
    --accent:     #56c4bd;
    --accent-ink: #7ad6cf;
    --accent-wash:#122e30;
    --warn:       #e0a464;
    --warn-wash:  #2c2317;
    --code-bg:    #0a1a20;
    --code-ink:   #cfe2e8;
    --shadow:     0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    --wm-alpha:   .055;
  }
}

:root[data-theme="dark"] {
  --paper:      #0e141a;
  --surface:    #151d25;
  --surface-2:  #1c262f;
  --ink:        #e4ecf2;
  --ink-soft:   #a6b4c1;
  --ink-faint:  #7d8b99;
  --rule:       #25313c;
  --accent:     #56c4bd;
  --accent-ink: #7ad6cf;
  --accent-wash:#122e30;
  --warn:       #e0a464;
  --warn-wash:  #2c2317;
  --code-bg:    #0a1a20;
  --code-ink:   #cfe2e8;
  --shadow:     0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  --wm-alpha:   .055;
}

* { box-sizing: border-box; }

/* an element carrying [hidden] must stay hidden even when a rule below
   gives it a display of its own */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

/* --- top bar ------------------------------------------------------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1rem 1.5rem;
  padding: .75rem 1.5rem;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: .5rem;
  margin-inline-end: auto;
  font-weight: 700;
  letter-spacing: -.01em;
}

.brand .crud {
  display: inline-flex;
  gap: .18rem;
  font-family: var(--f-mono);
  font-size: .78rem;
  font-weight: 600;
  color: var(--accent);
}

.brand .crud span {
  display: inline-grid;
  place-items: center;
  width: 1.35rem;
  height: 1.35rem;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: 4px;
  background: var(--accent-wash);
}

.brand b { font-size: 1rem; }

/* --- segmented switches -------------------------------------------------- */
.switch {
  display: flex;
  align-items: center;
  gap: .5rem;
}

.switch > .lbl {
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.seg {
  display: inline-flex;
  padding: 2px;
  background: var(--surface-2);
  border-radius: 8px;
}

.seg button {
  padding: .35rem .8rem;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink-soft);
  font-family: inherit;
  font-size: .85rem;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s, color .15s;
}

.seg button:hover { color: var(--ink); }

.seg button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--accent-ink);
  font-weight: 700;
  box-shadow: var(--shadow);
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink-soft);
  font-size: .95rem;
  cursor: pointer;
}

.icon-btn:hover { color: var(--accent-ink); border-color: var(--accent); }

:where(button, a):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* --- jumping between steps on a phone ------------------------------------
   The rail is no use on a narrow screen — it becomes a small scrolling box
   above the text. A native picker of the thirteen steps is one tap instead.
   ------------------------------------------------------------------------ */
.jump {
  display: none;
  max-width: 12rem;
  padding: .4rem .6rem;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: .85rem;
}

/* --- shell --------------------------------------------------------------- */
.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  align-items: start;
  gap: 2.5rem;
  max-width: 74rem;
  margin: 0 auto;
  padding: 2rem 1.5rem 5rem;
}

/* --- watermark -----------------------------------------------------------
   Faint, repeated, and behind everything the reader touches. It cannot be
   selected or clicked, so it never gets in the way — it only rides along
   into a screenshot or a printout.
   ------------------------------------------------------------------------ */
.watermark {
  position: fixed;
  inset: -30%;
  z-index: 5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.6rem;
  overflow: hidden;
  transform: rotate(-24deg);
  opacity: var(--wm-alpha);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: .05em;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.watermark span { display: block; text-align: center; }

/* --- notice ------------------------------------------------------------- */
.notice {
  min-width: 0;
  grid-column: 2;          /* the reading column, in either direction */
  max-width: var(--measure);
  margin-inline: auto;
  display: flex;
  gap: .7rem;
  padding: .85rem 1.15rem;
  border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  border-inline-start: 4px solid var(--warn);
  border-radius: 10px;
  background: var(--warn-wash);
  color: var(--warn);
  font-family: var(--f-ui);
  font-size: .9rem;
  font-weight: 500;
  line-height: 1.75;
  white-space: pre-line;
}

.notice .mark { flex: none; font-size: 1.05rem; line-height: 1.5; }

/* --- rail ---------------------------------------------------------------- */
.rail {
  position: sticky;
  top: 4.5rem;
  align-self: start;
  height: fit-content;
  max-height: calc(100vh - 7rem);
  overflow-y: auto;
  padding-inline-end: .5rem;
}

.rail h2 {
  margin: 0 0 .75rem;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.toc { display: flex; flex-direction: column; gap: .1rem; }

.toc a {
  display: block;
  padding: .3rem .55rem;
  border-inline-start: 2px solid transparent;
  border-radius: 0 5px 5px 0;
  color: var(--ink-soft);
  font-size: .85rem;
  line-height: 1.45;
  text-decoration: none;
}

.toc a:hover { background: var(--surface-2); color: var(--ink); }

.toc a.lvl-1 { font-weight: 600; color: var(--ink); margin-top: .45rem; }
.toc a.lvl-2 { padding-inline-start: 1.1rem; }
.toc a.lvl-3 { padding-inline-start: 1.9rem; font-size: .8rem; color: var(--ink-faint); }

.toc a.here {
  border-inline-start-color: var(--accent);
  background: var(--accent-wash);
  color: var(--accent-ink);
}

/* --- reader -------------------------------------------------------------- */
.reader {
  min-width: 0;
  max-width: var(--measure);
  margin-inline: auto;
  padding: 2.25rem 2.5rem 3rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 12px;
  box-shadow: var(--shadow);
}

[dir="rtl"] .reader { font-family: var(--f-ar); line-height: 1.95; }
[dir="ltr"] .reader { font-family: var(--f-la); line-height: 1.7; }

.reader h1, .reader h2, .reader h3 {
  font-family: var(--f-ui);
  text-wrap: balance;
  scroll-margin-top: 5rem;
}

.reader h1 {
  margin: 2.5rem 0 1rem;
  padding-bottom: .6rem;
  border-bottom: 2px solid var(--accent);
  font-size: 1.7rem;
  line-height: 1.4;
  letter-spacing: -.01em;
}

.reader > h1:first-child { margin-top: 0; }

.reader h2 {
  margin: 2.25rem 0 .75rem;
  font-size: 1.2rem;
  line-height: 1.5;
  color: var(--accent-ink);
}

.reader h3 {
  margin: 1.75rem 0 .5rem;
  font-size: 1rem;
  color: var(--ink);
}

.reader p { margin: 0 0 1rem; }

.reader ul, .reader ol { margin: 0 0 1rem; padding-inline-start: 1.5rem; }
.reader li { margin-bottom: .4rem; }
[dir="rtl"] .reader ol { list-style-type: arabic-indic; }

.reader a { color: var(--accent-ink); text-underline-offset: .18em; }

.reader hr {
  margin: 2.5rem 0;
  border: 0;
  border-top: 1px solid var(--rule);
}

.reader code {
  padding: .12em .38em;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--accent-ink);
  font-family: var(--f-mono);
  font-size: .85em;
  direction: ltr;
  unicode-bidi: embed;
}

/* --- collapsed explanations ----------------------------------------------
   A reader who already follows the code walks straight past these; one who
   does not opens them. Closed by default so the page stays short.
   ------------------------------------------------------------------------ */
.explain {
  margin: 0 0 1.25rem;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--surface-2);
}

.explain > summary {
  padding: .7rem 1rem;
  color: var(--accent-ink);
  font-family: var(--f-ui);
  font-size: .92rem;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
}

.explain > summary::-webkit-details-marker { display: none; }

.explain > summary::before {
  content: "▸";
  margin-inline-end: .55rem;
  font-size: .85em;
}

[dir="rtl"] .explain > summary::before { content: "◂"; }

.explain[open] > summary::before,
[dir="rtl"] .explain[open] > summary::before { content: "▾"; }

.explain > :not(summary) { margin-inline: 1rem; }
.explain > :last-child { margin-bottom: 1rem; }

/* --- where a block of code goes ----------------------------------------- */
.block > .where {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding: .45rem .95rem;
  border-radius: 10px 10px 0 0;
  background: #0b232c;
  color: #8fb4bf;
  font-family: var(--f-mono);
  font-size: .74rem;
  letter-spacing: .02em;
}

.block > .where + pre { border-radius: 0 0 10px 10px; }

.block > .where .hint { color: #6f96a2; font-style: italic; }

/* --- a change, shown as a change -----------------------------------------
   Removed lines are struck through, added lines are marked. The copy
   button hands over the result, not the diff.
   ------------------------------------------------------------------------ */
/* a blank line still occupies one, so an added empty line is visible */
.block pre code span { display: block; min-height: 1.65em; }

.block pre code .add {
  background: rgba(87, 197, 148, .16);
  color: #a9e9c8;
}

.block pre code .del {
  background: rgba(226, 106, 106, .14);
  color: #e7aaaa;
  text-decoration: line-through;
  text-decoration-color: rgba(231, 170, 170, .6);
}

/* --- code blocks --------------------------------------------------------- */
.block {
  min-width: 0;
  position: relative;
  margin: 0 0 1.25rem;
  direction: ltr;
}

.block pre {
  margin: 0;
  padding: 1rem 1.15rem;
  overflow-x: auto;
  background: var(--code-bg);
  border-radius: 10px;
  color: var(--code-ink);
  font-family: var(--f-mono);
  font-size: .82rem;
  line-height: 1.65;
  tab-size: 4;
}

.block pre code {
  padding: 0;
  background: none;
  color: inherit;
  font-size: inherit;
}

.copy {
  position: absolute;
  inset-block-start: .5rem;
  inset-inline-end: .5rem;
  padding: .25rem .6rem;
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 6px;
  background: rgba(255, 255, 255, .07);
  color: #cfe2e8;
  font-family: var(--f-ui);
  font-size: .72rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s;
}

.block:hover .copy, .copy:focus-visible { opacity: 1; }
.copy[data-done="1"] { color: #8fe3c8; border-color: #8fe3c8; }

/* --- tables -------------------------------------------------------------- */
.table-wrap { margin: 0 0 1.25rem; overflow-x: auto; }

.reader table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--f-ui);
  font-size: .88rem;
  font-variant-numeric: tabular-nums;
}

.reader th, .reader td {
  padding: .55rem .8rem;
  border-bottom: 1px solid var(--rule);
  text-align: start;
  vertical-align: top;
}

.reader thead th {
  border-bottom: 2px solid var(--rule);
  color: var(--ink-faint);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
}

.reader tbody tr:last-child td { border-bottom: 0; }

/* --- callouts ------------------------------------------------------------ */
.reader blockquote {
  margin: 0 0 1.25rem;
  padding: .9rem 1.15rem;
  border-inline-start: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  background: var(--accent-wash);
  color: var(--ink-soft);
  font-size: .93em;
}

[dir="rtl"] .reader blockquote { border-radius: 8px 0 0 8px; }

.reader blockquote > :last-child { margin-bottom: 0; }

.reader blockquote:has(h3) {
  border-inline-start-color: var(--warn);
  background: var(--warn-wash);
}

.reader blockquote h3 {
  margin-top: 0;
  color: var(--warn);
  font-size: .95rem;
}

/* --- loading / failed ---------------------------------------------------- */
.state {
  margin: 0;
  padding: 3rem 0;
  color: var(--ink-faint);
  font-family: var(--f-ui);
  text-align: center;
}

/* --- an editor, and a plain page, for the code walkthroughs ------------- */
.tabs {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: #f3f6f9;
  border-bottom: 1px solid #e2e8ee;
  font-size: 11.5px;
}

.tabs .tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: #fff;
  border: 1px solid #e2e8ee;
  border-bottom: 0;
  border-radius: 5px 5px 0 0;
  font-family: var(--f-mono);
}

.tabs .tab .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #94a3b8;
}

.tabs .tab.saved .dot { background: transparent; }

.editor {
  height: 100%;
  padding: 8px 12px;
  overflow: hidden;
  background: #fbfcfd;
  color: #16202b;
  font-family: var(--f-mono);
  /* thirteen lines have to fit without scrolling */
  font-size: 10.5px;
  line-height: 1.5;
  white-space: pre;
}

.editor .kw { color: #2563eb; }

.vs-main.pad0 { padding: 0; }

/* a page with nothing but a heading on it */
.plain {
  padding: 26px 20px;
  background: #fff;
  font-family: "Segoe UI", Tahoma, sans-serif;
}

.plain h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 700;
  color: #16202b;
}

.keys {
  position: absolute;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  padding: 6px 14px;
  border-radius: 8px;
  background: rgba(11, 35, 44, .92);
  color: #cfe2e8;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: .04em;
  z-index: 6;
}

/* --- windows for the folder walkthrough --------------------------------- */
.fx { inset: 1.25rem 2rem; }

.fx-bar { background: #eef2f6; color: #4a5a6b; }
.fx-bar i { background: #c3ccd6; }

.fx-body { display: flex; height: calc(100% - 30px); }

.fx-side {
  width: 9rem;
  padding: 10px 8px;
  background: #f6f8fa;
  border-right: 1px solid #e2e8ee;
  font-size: 12px;
}

.fx-side span { display: block; padding: 4px 6px; border-radius: 4px; }
.fx-side span.on { background: #dbeafe; color: #1d4ed8; font-weight: 600; }

.fx-main { position: relative; flex: 1; padding: 12px; }

.tile {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 6rem;
  padding: 8px 4px;
  border-radius: 6px;
  font-size: 12px;
  text-align: center;
}

.tile em { font-style: normal; font-size: 26px; line-height: 1; }
.tile.sel { background: #dbeafe; box-shadow: 0 0 0 1px #93c5fd inset; }

.tile .name {
  padding: 1px 4px;
  border-radius: 3px;
  background: #fff;
  box-shadow: 0 0 0 1px #2563eb;
  font-family: var(--f-mono);
  font-size: 11px;
}

/* a context menu, and the File menu */
.menu {
  position: absolute;
  min-width: 10rem;
  padding: 5px;
  background: #fff;
  border: 1px solid #dfe5ec;
  border-radius: 7px;
  box-shadow: 0 10px 26px -8px rgba(16, 32, 44, .4);
  font-size: 12px;
  z-index: 4;
}

.menu div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 5px 8px;
  border-radius: 4px;
}

.menu div.on { background: #2563eb; color: #fff; }
.menu div.sep { padding: 0; margin: 4px 2px; height: 1px; background: #e2e8ee; }

/* a dialog with a message and buttons */
.ask { width: 24rem; left: 50%; top: 50%; transform: translate(-50%, -50%); }

.ask-body { padding: 16px; font-size: 12.5px; line-height: 1.6; }
.ask-body b { display: block; margin-bottom: 6px; font-size: 13px; }

.ask .btn3 {
  padding: 7px 14px;
  border-radius: 5px;
  background: #2563eb;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
}

/* the VS Code explorer, with its icon strip */
.vs-side .head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 10.5px;
  color: #6b7280;
  letter-spacing: .04em;
}

.vs-side .icons { display: flex; gap: 5px; font-size: 12px; }
.vs-side .icons span { padding: 1px 3px; border-radius: 3px; }
.vs-side .icons span.on { background: #dbeafe; }

.vs-row {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 2px 0;
  font-family: var(--f-mono);
  font-size: 11px;
}

.vs-row .name {
  padding: 0 3px;
  border-radius: 3px;
  background: #fff;
  box-shadow: 0 0 0 1px #2563eb;
}

/* inside the editor, .name marks the line that was just added, in the same
   green the guide uses for added lines in its diffs */
.editor .name {
  padding: 1px 3px;
  border-radius: 3px;
  background: rgba(22, 163, 74, 0.15);
  box-shadow: inset 2px 0 0 #16a34a;
  color: #14532d;
}

/* --- the drawn walkthrough ------------------------------------------------
   A silent, drawn stand-in for a screen recording: mock windows, a cursor
   that moves and clicks, one caption per scene. Nothing is recorded and
   nothing is downloaded — it is HTML, so it stays small and stays in the
   reader's own language.
   ------------------------------------------------------------------------ */
.stage {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 1.25rem;
  background: rgba(8, 16, 20, .78);
  backdrop-filter: blur(3px);
}

.stage-box {
  display: flex;
  flex-direction: column;
  width: min(100%, 56rem);
  border-radius: 14px;
  overflow: hidden;
  background: var(--surface);
  box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .8);
}

.stage-caption {
  display: flex;
  align-items: center;

<script>
(function () {

    en: { brand: "Student Guide", langLabel: "Language", tocLabel: "Contents",
          copy: "Copy", copied: "Copied",
          keep: "To keep a copy, press Ctrl + P and print to PDF",
          terminal: "Terminal",
          copyNew: "copy = the new code only",
          showMe: "Show me this step",
          loading: "Loading the text…",
          failed: "The text could not be loaded. Check your connection and reload the page." }
  };

  var STORE = "studentGuide";
  var NOTICE_KU = "ئەم وەشانە کوردییە تەنها بۆ تێگەیشتنی خۆتە.\nتاقیکردنەوە و وەڵامدانەوە تەنها لەسەر وەشانی ئینگلیزییە.";
  var MARK_KU = "تەنها بۆ تێگەیشتن — وەڵامدانەوە بە ئینگلیزییە";
  var state = { lang: "ku" };

  /* ---- storage is a convenience, never a requirement -------------------- */
  function remember(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }
  function recall(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  /* ---- markdown ---------------------------------------------------------
     A small parser, written out in full so the page works with no network
     and no library — the same rule the project itself follows.            */

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function (m, c) { return "<code>" + c + "</code>"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
      var ext = /^https?:/.test(u);
      return '<a href="' + u + '"' + (ext ? ' target="_blank" rel="noopener"' : "") + ">" + t + "</a>";
    });
    s = s.replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  var LIST_ORDERED = /^[0-9٠-٩۰-۹]+[.)]\s+/;
  var LIST_BULLET = /^[-*]\s+/;

  function render(md, headings) {
    var lines = md.replace(/\r\n/g, "\n").split("\n");
    var out = [];
    var i = 0;
    var para = [];

    function flushPara() {
      if (para.length) {
        out.push("<p>" + inline(para.join(" ")) + "</p>");
        para = [];
      }
    }

    while (i < lines.length) {
      var line = lines[i];

      /* fenced code */
      if (/^```/.test(line)) {
        flushPara();
        var fence = line.slice(3).trim().split(/\s+/);
        var lang = fence[0] || "";
        var where = fence.slice(1).join(" ") ||
          (lang === "bash" ? UI[state.lang].terminal : "");
        var code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        var inner, clean = code.join('\n');
        if (lang === "diff") {
          inner = code.map(function (row) {
            var mark = row.charAt(0);
            var kind = mark === '+' ? 'add' : (mark === '-' ? 'del' : 'same');

            return '<span class="' + kind + '">' + esc(row.slice(1)) + '</span>';

        } else {
          inner = esc(clean);
        }

        out.push('<div class="block"><button type="button" class="copy">' +
          UI[state.lang].copy + '</button>' +
          (where ? '<div class="where"><span>' + esc(where) + '</span>' +
            (lang === "diff" ? '<span class="hint">' +
              esc(UI[state.lang].copyNew) + '</span>' : '') + '</div>' : '') +
          '<pre><code data-lang="' + esc(lang) + '" data-copy="' +
          esc(clean) + '">' + inner + '</code></pre></div>');

      }

      /* table */
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {

        var cells = function (row) {
          return row.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
        };
        var head = cells(line);
        i += 2;
        var body = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { body.push(cells(lines[i])); i++; }
        var t = "<div class='table-wrap'><table><thead><tr>";
        head.forEach(function (c) { t += "<th>" + inline(c) + "</th>"; });
        t += "</tr></thead><tbody>";
        body.forEach(function (row) {
          t += "<tr>";
          row.forEach(function (c) { t += "<td>" + inline(c) + "</td>"; });
          t += "</tr>";
        });
        out.push(t + "</tbody></table></div>");
        continue;
      }

      /* heading */
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) {
        flushPara();
        var level = h[1].length;
        var id = "h" + headings.length;
        headings.push({ id: id, level: level, text: h[2].replace(/[*`]/g, "") });
        out.push("<h" + level + ' id="' + id + '">' + inline(h[2]) + "</h" + level + ">");
        i++;
        continue;
      }

      /* an explanation the reader opens if they want it — the heading after
         the marker becomes the summary, and everything under it the body */
      if (/^<!--\s*collapse\s*-->\s*$/.test(line)) {
        flushPara();
        i++;
        var mark = /^(#{1,6})\s+(.*)$/.exec(lines[i] || "");
        if (!mark) { continue; }
        var depth = mark[1].length;
        var boxId = "h" + headings.length;
        headings.push({ id: boxId, level: depth, text: mark[2].replace(/[*`]/g, "") });
        i++;
        var inside = [];
        while (i < lines.length) {
          var ahead = /^(#{1,6})\s+/.exec(lines[i]);
          if (ahead && ahead[1].length <= depth) { break; }
          /* a marker always opens a section of its own — without this it
             would be swallowed by the box above it */
          if (/^<!--\s*collapse\s*-->\s*$/.test(lines[i])) { break; }
          inside.push(lines[i]);
          i++;
        }
        out.push('<details class="explain" id="' + boxId + '"><summary>' +
          inline(mark[2]) + "</summary>" + render(inside.join("\n"), headings) +
          "</details>");
        continue;
      }

      /* horizontal rule */
      if (/^\s*(---|\*\*\*)\s*$/.test(line)) {
        flushPara();
        out.push("<hr>");
        i++;
        continue;
      }

      /* blockquote — collected, then parsed as a document of its own */
      if (/^\s*>/.test(line)) {
        flushPara();
        var quoted = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          quoted.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push("<blockquote>" + render(quoted.join("\n"), headings) + "</blockquote>");
        continue;
      }

      /* lists */
      if (LIST_BULLET.test(line) || LIST_ORDERED.test(line)) {
        flushPara();
        var ordered = LIST_ORDERED.test(line);
        var items = [];
        while (i < lines.length && (LIST_BULLET.test(lines[i]) || LIST_ORDERED.test(lines[i]))) {
          items.push(lines[i].replace(ordered ? LIST_ORDERED : LIST_BULLET, ""));
          i++;
          /* a wrapped continuation line belongs to the item above it */
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) &&
                 !LIST_BULLET.test(lines[i].trim()) && !LIST_ORDERED.test(lines[i].trim())) {
            items[items.length - 1] += " " + lines[i].trim();
            i++;
          }
        }
        var tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map(function (it) {
          return "<li>" + inline(it) + "</li>";
        }).join("") + "</" + tag + ">");
        continue;
      }

      if (!line.trim()) { flushPara(); i++; continue; }

      para.push(line.trim());
      i++;
    }

    flushPara();
    return out.join("\n");
  }

  /* ---- painting ---------------------------------------------------------- */
  var reader = document.getElementById("reader");
  var notice = document.getElementById("notice");
  var watermark = document.getElementById("watermark");
  var toc = document.getElementById("toc");
  var jump = document.getElementById("jump");
  var app = document.querySelector(".app");

  function paint() {
    if (DOCS[state.lang] === undefined && FETCH && FETCH[state.lang]) {
      return fetchGuide(state.lang);
    }

    var md = DOCS[state.lang] || "";
    var headings = [];
    var rtl = state.lang === "ku";

    app.setAttribute("dir", rtl ? "rtl" : "ltr");
    document.documentElement.lang = rtl ? "ckb" : "en";

    /* the Kurdish text is a translation to read alongside, not the one
       the student is examined on — say so, and only while it is showing */
    if (NOTICE_KU && state.lang === "ku") {
      notice.querySelector(".text").textContent = NOTICE_KU;
      notice.hidden = false;
    } else {
      notice.hidden = true;
    }

    if (MARK_KU && state.lang === "ku") {
      if (!watermark.childNodes.length) {
        var row = new Array(8).join(MARK_KU + "   ·   ");
        for (var r = 0; r < 30; r++) {
          var line = document.createElement("span");
          line.textContent = row;
          watermark.appendChild(line);
        }
      }
      watermark.hidden = false;
    } else {
      watermark.hidden = true;
    }

    reader.innerHTML = render(md, headings);
    reader.scrollIntoView({ block: "start" });
    window.scrollTo(0, 0);

    /* labels follow the reading language */
    var words = UI[state.lang];
    document.querySelectorAll("[data-t]").forEach(function (el) {
      var w = words[el.getAttribute("data-t")];
      if (w) { el.textContent = w; }
    });

    /* The tab, and the header the browser prints on every sheet, both come
       from the document title — so it follows the guide and its language. */
    document.title = headings.length ? headings[0].text : document.title;

    addShowMeButtons();

    /* a picker of the steps, for narrow screens */
    jump.innerHTML = "";
    headings.filter(function (h) { return h.level === 1; }).forEach(function (h) {
      var option = document.createElement("option");
      option.value = h.id;
      option.textContent = h.text;
      jump.appendChild(option);
    });

    /* contents */
    toc.innerHTML = "";
    headings.filter(function (h) { return h.level <= 3; }).forEach(function (h) {
      var a = document.createElement("a");
      a.href = "#" + h.id;
      a.className = "lvl-" + h.level;
      a.textContent = h.text;
      toc.appendChild(a);
    });

    /* switch states */
    document.querySelectorAll("#langSeg button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang));
    });

    spy();
  }

  /* ---- fetching the text ------------------------------------------------ */
  function fetchGuide(lang) {
    var words = UI[lang];
    reader.innerHTML = '<p class="state">' + words.loading + "</p>";
    fetch(FETCH[lang], { cache: "no-cache" }).then(function (response) {
      if (!response.ok) { throw new Error(response.status); }
      return response.text();
    }).then(function (text) {
      DOCS[lang] = text;
      paint();
    })["catch"](function () {
      reader.innerHTML = '<p class="state">' + words.failed + "</p>";
    });
  }

  /* ---- the step player ---------------------------------------------------
     Replays one step: every block of code in it, typed out in order, with
     the file it belongs in named above. The frames are read out of the page
     itself, so the replay always matches what the step says.

     Only the steps listed in PLAYER_STEPS get a button — the rest follow
     once this one has been seen in class.                              */
  /* which steps get a code replay — the walkthrough covers step 1 */
  var PLAYER_STEPS = [];
  var STAGE_STEPS = [1, 2, 3, 4, 5, 6];

  var player = document.getElementById("player");
  var playerWhere = player.querySelector(".where");
  var playerCount = player.querySelector(".count");
  var playerCode = player.querySelector(".player-code");
  var playerDots = player.querySelector(".dots");
  var playerToggle = player.querySelector('[data-act="toggle"]');
  var playerSpeed = player.querySelector('[data-act="speed"]');

  var reel = { frames: [], at: 0, typed: 0, shown: false,
               timer: null, playing: false, rate: 1 };
  var NL = String.fromCharCode(10);
  var SPEEDS = [1, 2, 0.5];
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function framesFor(heading) {
    var raw = [];
    var node = heading.nextElementSibling;
    while (node && node.tagName !== "H1") {
      var blocks = node.classList && node.classList.contains("block")
        ? [node]
        : (node.querySelectorAll ? node.querySelectorAll(".block") : []);
      Array.prototype.forEach.call(blocks, function (block) {
        var code = block.querySelector("code");
        if (!code) { return; }
        var label = block.querySelector(".where span");
        raw.push({
          where: label ? label.textContent : "",
          lang: code.getAttribute("data-lang") || "",
          code: code.getAttribute("data-copy") || code.textContent
        });
      });
      node = node.nextElementSibling;
    }

    /* A command and the output printed under it belong together — the
       output block carries no label, which is how it is recognised. An
       unlabelled block on its own is an illustration, not a step. */
    var frames = [];
    for (var i = 0; i < raw.length; i += 1) {
      if (!raw[i].where) { continue; }
      var frame = { where: raw[i].where, text: raw[i].code, out: "" };
      if (raw[i].lang === "bash" && raw[i + 1] && !raw[i + 1].where) {
        frame.out = raw[i + 1].code;
        i += 1;
      }
      /* the summary at the end of a step repeats its commands — show
         each one once */
      if (!frames.some(function (had) { return had.text === frame.text; })) {
        frames.push(frame);
      }
    }
    return frames;
  }

  function drawDots() {
    playerDots.innerHTML = "";
    reel.frames.forEach(function (_, index) {
      var dot = document.createElement("i");
      if (index === reel.at) { dot.className = "on"; }
      playerDots.appendChild(dot);
    });
  }

  function drawFrame() {
    var frame = reel.frames[reel.at];
    playerWhere.textContent = frame.where;
    playerCount.textContent = (reel.at + 1) + " / " + reel.frames.length;

    playerCode.textContent = frame.text.slice(0, reel.typed);
    if (reel.typed < frame.text.length) {
      playerCode.appendChild(document.createElement("span")).className = "caret";
    } else if (frame.out && reel.shown) {
      var answer = document.createElement("span");
      answer.className = "answer";
      answer.textContent = "\n\n" + frame.out;
      playerCode.appendChild(answer);
    }
    drawDots();
    playerCode.scrollTop = playerCode.scrollHeight;
  }

  function stopTimer() {
    if (reel.timer) { clearInterval(reel.timer); reel.timer = null; }
  }

  function nextFrame() {
    if (reel.at + 1 >= reel.frames.length) {
      setPlaying(false);
      return;
    }
    reel.at += 1;
    reel.typed = 0;
    reel.shown = false;
    setPlaying(true);
  }

  function setPlaying(on) {
    reel.playing = on;
    playerToggle.textContent = on ? "⏸" : "▶";
    stopTimer();
    if (!on) { return; }

    reel.timer = setInterval(function () {
      var frame = reel.frames[reel.at];

      if (reel.typed < frame.text.length) {
        reel.typed = Math.min(frame.text.length,
                              reel.typed + Math.ceil(3 * reel.rate));
        drawFrame();
        return;
      }

      stopTimer();
      if (frame.out && !reel.shown) {
        setTimeout(function () {
          if (!reel.playing) { return; }
          reel.shown = true;
          drawFrame();
          setTimeout(function () { if (reel.playing) { nextFrame(); } },
                     1400 / reel.rate);
        }, 450 / reel.rate);
        return;
      }
      setTimeout(function () { if (reel.playing) { nextFrame(); } },
                 900 / reel.rate);
    }, 16);
  }

  function goTo(index) {
    reel.at = Math.max(0, Math.min(reel.frames.length - 1, index));
    reel.typed = calm ? reel.frames[reel.at].text.length : 0;
    reel.shown = calm;
    drawFrame();
  }

  function openPlayer(heading) {
    reel.frames = framesFor(heading);
    if (!reel.frames.length) { return; }
    reel.rate = 1;
    playerSpeed.textContent = "1×";
    player.hidden = false;
    player.removeAttribute("aria-hidden");
    goTo(0);
    if (!calm) { setPlaying(true); }
  }

  function closePlayer() {
    setPlaying(false);
    player.hidden = true;
    player.setAttribute("aria-hidden", "true");
  }

  player.addEventListener("click", function (e) {
    if (e.target === player) { closePlayer(); return; }
    var act = e.target.closest("[data-act]");
    if (!act) { return; }
    var what = act.getAttribute("data-act");

    if (what === "close") { closePlayer(); }
    if (what === "toggle") { setPlaying(!reel.playing); }
    if (what === "prev") { setPlaying(false); goTo(reel.at - 1); }
    if (what === "next") { setPlaying(false); goTo(reel.at + 1); }
    if (what === "speed") {
      reel.rate = SPEEDS[(SPEEDS.indexOf(reel.rate) + 1) % SPEEDS.length];
      act.textContent = reel.rate + "×";
      if (reel.playing) { setPlaying(true); }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (player.hidden) { return; }
    if (e.key === "Escape") { closePlayer(); }
    if (e.key === " ") { e.preventDefault(); setPlaying(!reel.playing); }
    if (e.key === "ArrowRight") { setPlaying(false); goTo(reel.at + 1); }
    if (e.key === "ArrowLeft") { setPlaying(false); goTo(reel.at - 1); }
  });

  /* The step number is read from the heading itself, not counted.
     Step 3 shows the browser's own <h1>Hello</h1> as a real heading, and
     counting would treat that as a step and shift every later one. */
  function stepNumberOf(heading) {
    var match = heading.textContent.match(
      /^\s*(?:هەنگاوی|Step)\s*([0-9٠-٩]+)/);
    if (!match) { return 0; }
    var digits = match[1].replace(/[٠-٩]/g, function (d) {
      return String(d.charCodeAt(0) - 1632);
    });
    return parseInt(digits, 10) || 0;
  }

  function addShowMeButtons() {
    reader.querySelectorAll("h1").forEach(function (heading) {
      var step = stepNumberOf(heading);
      if (!step) { return; }
      var drawn = STAGE_STEPS.indexOf(step) !== -1;
      if (!drawn && PLAYER_STEPS.indexOf(step) === -1) { return; }
      var button = document.createElement("button");
      button.type = "button";
      button.className = "show-me";
      button.textContent = "▶  " + UI[state.lang].showMe;
      var walk = step;
      var open = drawn ? function () { openStage(walk); }
                       : function () { openPlayer(heading); };
      button.addEventListener("click", open);
      heading.parentNode.insertBefore(button, heading.nextSibling);
    });
  }

      screen: function () { return styledPage(); },
      spot: "card", hold: 2400 }
  ];



  var stage = document.getElementById("stage");
  var stageCap = stage.querySelector(".stage-caption span:last-child");
  var stageNum = stage.querySelector(".stage-caption .num");
  var stageScreen = stage.querySelector(".screen");
  var stagePointer = stage.querySelector(".pointer");
  var stageDots = stage.querySelector(".dots");
  var stageToggle = stage.querySelector('[data-act="toggle"]');
  var stageSpeed = stage.querySelector('[data-act="speed"]');

  var show = { list: [], at: 0, playing: false, rate: 1, timers: [] };

  function clearTimers() {
    show.timers.forEach(clearTimeout);
    show.timers = [];
  }

  function later(fn, ms) {
    show.timers.push(setTimeout(fn, ms / show.rate));
  }

  function typeInto(node, text, done) {
    /* a whole file would take half a minute one letter at a time */
    var long = text.length > 90;
    var step = long ? 3 : 1;
    var wait = long ? 16 : 55;
    var at = 0;
    (function tick() {
      node.textContent = text.slice(0, at);
      var pane = node.closest(".editor") || node.closest(".term-body");
      if (pane) { pane.scrollTop = pane.scrollHeight; }
      if (at >= text.length) { return done && done(); }
      at = Math.min(text.length, at + step);
      later(tick, wait);
    })();
  }

  function drawScene(index, animate) {
    clearTimers();
    show.at = Math.max(0, Math.min(show.list.length - 1, index));
    var scene = show.list[show.at];

    stageNum.textContent = (show.at + 1) + "/" + show.list.length;
    stageCap.textContent = scene[state.lang] || scene.en;
    stageScreen.innerHTML = scene.screen() +
      '<div class="pointer">' + stagePointer.innerHTML + '</div>';
    stagePointer = stageScreen.querySelector(".pointer");

    stageDots.innerHTML = "";
    show.list.forEach(function (_, n) {
      var dot = document.createElement("i");
      if (n === show.at) { dot.className = "on"; }
      stageDots.appendChild(dot);
    });

    var fill = stageScreen.querySelector("[data-fill]");
    if (fill) { later(function () { fill.style.width = "100%"; }, 60); }

    var typed = stageScreen.querySelector("[data-type]");
    var after = stageScreen.querySelector("[data-after]");

    function afterScene() {
      if (!show.playing) { return; }
      later(function () {
        if (!show.playing) { return; }
        if (show.at + 1 >= show.list.length) { setShowing(false); return; }
        drawScene(show.at + 1, true);
      }, scene.hold || 1200);
    }

    if (typed && animate && !calm) {
      typeInto(typed, typed.getAttribute("data-type"), function () {
        if (after) { later(function () { after.textContent = after.getAttribute("data-after"); }, 500); }
        afterScene();
      });
      return;
    }
    if (typed) { typed.textContent = typed.getAttribute("data-type"); }
    if (after) { after.textContent = after.getAttribute("data-after"); }

    var spot = scene.spot && stageScreen.querySelector('[data-spot="' + scene.spot + '"]');
    if (spot && animate && !calm) {
      later(function () {
        var box = spot.getBoundingClientRect();
        var frame = stageScreen.getBoundingClientRect();
        stagePointer.style.left = (box.left - frame.left + box.width / 2) + "px";
        stagePointer.style.top = (box.top - frame.top + box.height / 2) + "px";
        later(function () {
          stagePointer.classList.add("tap");
          afterScene();
        }, 820);
      }, 220);
      return;
    }
    afterScene();
  }

  function setShowing(on) {
    show.playing = on;
    stageToggle.textContent = on ? "⏸" : "▶";
    if (!on) { clearTimers(); return; }
    drawScene(show.at, true);
  }

  function openStage(step) {
    show.list = WALKS[step] || [];
    if (!show.list.length) { return; }
    stage.hidden = false;
    stage.removeAttribute("aria-hidden");
    show.at = 0;
    show.rate = 1;
    stageSpeed.textContent = "1×";
    setShowing(!calm);
    if (calm) { drawScene(0, false); }
  }

  function closeStage() {
    show.playing = false;
    clearTimers();
    stage.hidden = true;
    stage.setAttribute("aria-hidden", "true");
  }

  stage.addEventListener("click", function (e) {
    if (e.target === stage) { closeStage(); return; }
    var act = e.target.closest("[data-act]");
    if (!act) { return; }
    var what = act.getAttribute("data-act");

    if (what === "close") { closeStage(); }
    if (what === "toggle") { setShowing(!show.playing); }
    if (what === "prev") { show.playing = false; stageToggle.textContent = "▶"; drawScene(show.at - 1, false); }
    if (what === "next") { show.playing = false; stageToggle.textContent = "▶"; drawScene(show.at + 1, false); }
    if (what === "speed") {
      show.rate = SPEEDS[(SPEEDS.indexOf(show.rate) + 1) % SPEEDS.length];
      act.textContent = show.rate + "×";
      if (show.playing) { setShowing(true); }
    }
  });

  document.addEventListener("keydown", function (e) {
    if (stage.hidden) { return; }
    if (e.key === "Escape") { closeStage(); }
    if (e.key === " ") { e.preventDefault(); setShowing(!show.playing); }
    if (e.key === "ArrowRight") { show.playing = false; drawScene(show.at + 1, false); }
    if (e.key === "ArrowLeft") { show.playing = false; drawScene(show.at - 1, false); }
  });

  /* ---- which section am I in? ------------------------------------------- */
  var spyTimer = null;
  var shown = null;
  function spy() {
    var links = toc.querySelectorAll("a");
    var current = null;
    reader.querySelectorAll("h1, h2, h3").forEach(function (h) {
      if (h.getBoundingClientRect().top < 120) { current = h.id; }
    });
    var active = null;
    if (current && jump.value !== current) {
      var owns = Array.prototype.some.call(jump.options, function (o) {
        return o.value === current;
      });
      if (owns) { jump.value = current; }
    }

    links.forEach(function (a) {
      var here = a.getAttribute("href") === "#" + current;
      a.classList.toggle("here", here);
      if (here) { active = a; }
    });

    /* The rail scrolls on its own once the guide is long, so bring the
       current entry into view. On a phone the rail is hidden — and
       scrolling a hidden element throws the page back to the top, so
       nothing is done unless the rail is really laid out. */
    var rail = toc.parentElement;
    if (active && active !== shown && rail.clientHeight > 0) {
      shown = active;
      var box = rail.getBoundingClientRect();
      var link = active.getBoundingClientRect();
      if (link.top < box.top + 8 || link.bottom > box.bottom - 8) {
        active.scrollIntoView({ block: "nearest" });
      }
    }
  }

  window.addEventListener("scroll", function () {
    if (spyTimer) { return; }
    spyTimer = setTimeout(function () { spyTimer = null; spy(); }, 120);
  }, { passive: true });

  /* ---- controls ---------------------------------------------------------- */
  document.getElementById("langSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { return; }
    state.lang = b.dataset.lang;
    remember(STORE + ".lang", state.lang);
    paint();
  });

  jump.addEventListener("change", function () {
    var target = document.getElementById(jump.value);
    if (!target) { return; }
    if (target.tagName === "DETAILS") { target.open = true; }
    target.scrollIntoView({ block: "start" });
  });

  toc.addEventListener("click", function (e) {
    var link = e.target.closest("a");
    if (!link) { return; }
    var target = document.getElementById(link.getAttribute("href").slice(1));
    if (target && target.tagName === "DETAILS") { target.open = true; }
  });

  document.getElementById("themeBtn").addEventListener("click", function () {
    var now = document.documentElement.getAttribute("data-theme");
    var dark = now
      ? now === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    remember("guide.theme", next);
  });

  document.getElementById("printBtn").addEventListener("click", function () {
    window.print();
  });

  reader.addEventListener("click", function (e) {
    var btn = e.target.closest(".copy");
    if (!btn) { return; }
    var code = btn.parentElement.querySelector("code");
    var text = code.getAttribute("data-copy") || code.textContent;
    var done = function () {
      btn.textContent = UI[state.lang].copied;
      btn.dataset.done = "1";
      setTimeout(function () {
        btn.textContent = UI[state.lang].copy;
        btn.dataset.done = "";
      }, 1400);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(done, function () { /* ignore */ });
    } else {
      var sel = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(code);
      sel.removeAllRanges();
      sel.addRange(range);
      done();
    }
  });

  /* ---- saving the page is not the path; printing to PDF is ---------------
     A browser menu can still save the file — this only turns the usual
     shortcuts towards the copy we want the student to make.              */
  var toast = document.getElementById("toast");
  var toastTimer = null;

  function hint(text) {
    toast.textContent = text;
    toast.hidden = false;
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { toast.hidden = true; }, 3200);
  }

  document.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) { return; }
    var key = (e.key || "").toLowerCase();
    if (key === "s" || key === "u") {
      e.preventDefault();
      hint(UI[state.lang].keep);
    }
  });

  document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    hint(UI[state.lang].keep);
  });

  /* ---- a printout is not interactive, so nothing may stay folded away ---- */
  window.addEventListener("beforeprint", function () {
    reader.querySelectorAll("details:not([open])").forEach(function (box) {
      box.dataset.wasClosed = "1";
      box.open = true;
    });
  });

  window.addEventListener("afterprint", function () {
    reader.querySelectorAll("details[data-was-closed]").forEach(function (box) {
      box.open = false;
      delete box.dataset.wasClosed;
    });
  });

  /* ---- copied Kurdish text carries the notice with it --------------------
     Code is left alone: a notice pasted into a .py file would break it.   */
  document.addEventListener("copy", function (e) {
    if (!NOTICE_KU || state.lang !== "ku" || !e.clipboardData) { return; }

    var sel = window.getSelection();
    var text = sel ? String(sel) : "";
    if (!text.trim()) { return; }

    var node = sel.anchorNode;
    if (node && node.nodeType === 3) { node = node.parentNode; }
    if (node && node.closest && node.closest("pre")) { return; }

    var rule = new Array(34).join("─");
    e.clipboardData.setData("text/plain",
      text + "\n\n" + rule + "\n" + NOTICE_KU);
    e.preventDefault();
  });

  /* ---- start ------------------------------------------------------------- */
  var savedTheme = recall("guide.theme");
  if (savedTheme) { document.documentElement.setAttribute("data-theme", savedTheme); }
  var savedLang = recall(STORE + ".lang");
  if (savedLang === "ku" || savedLang === "en") { state.lang = savedLang; }

  paint();
})();
</script>
<!-- ARTIFACT:END -->
</body>

<!DOCTYPE html>
<html lang="ckb">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<!-- ARTIFACT:START -->
<title>CRUD From Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ---------------------------------------------------------------------------
   CRUD From Zero — a bilingual classroom manual.
   Palette: cool paper + deep teal ink, an amber reserved for warnings only.
   Type:    Vazirmatn carries both scripts in headings and UI;
            reading text switches face with the script (Naskh / Source Serif).
   --------------------------------------------------------------------------- */

:root {
  --paper:      #f7f9fb;
  --surface:    #ffffff;
  --surface-2:  #eef2f6;
  --ink:        #16202b;
  --ink-soft:   #4a5a6b;
  --ink-faint:  #7d8b99;
  --rule:       #dde5ec;
  --accent:     #0d6e6e;
  --accent-ink: #0a5757;
  --accent-wash:#e2f1f0;
  --warn:       #9c5410;
  --warn-wash:  #fbf1e3;
  --code-bg:    #12303a;
  --code-ink:   #dbe9ee;
  --shadow:     0 1px 2px rgba(18, 40, 56, .06), 0 8px 24px -16px rgba(18, 40, 56, .35);

  --wm-alpha:   .035;
  --rail-w:     16.5rem;
  --measure:    68ch;

  --f-ui:   "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
  --f-ar:   "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
  --f-la:   "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0e141a;
    --surface:    #151d25;
    --surface-2:  #1c262f;
    --ink:        #e4ecf2;
    --ink-soft:   #a6b4c1;
    --ink-faint:  #7d8b99;
    --rule:       #25313c;
    --accent:     #56c4bd;
    --accent-ink: #7ad6cf;
    --accent-wash:#122e30;
    --warn:       #e0a464;
    --warn-wash:  #2c2317;
    --code-bg:    #0a1a20;
    --code-ink:   #cfe2e8;
    --shadow:     0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    --wm-alpha:   .055;
  }
}

:root[data-theme="dark"] {
  --paper:      #0e141a;
  --surface:    #151d25;
  --surface-2:  #1c262f;
  --ink:        #e4ecf2;
  --ink-soft:   #a6b4c1;
  --ink-faint:  #7d8b99;
  --rule:       #25313c;
  --accent:     #56c4bd;
  --accent-ink: #7ad6cf;
  --accent-wash:#122e30;
  --warn:       #e0a464;
  --warn-wash:  #2c2317;
  --code-bg:    #0a1a20;
  --code-ink:   #cfe2e8;
  --shadow:     0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  --wm-alpha:   .055;
}

* { box-sizing: border-box; }

/* an element carrying [hidden] must stay hidden even when a rule below
   gives it a display of its own */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

/* --- top bar ------------------------------------------------------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1rem 1.5rem;
  padding: .75rem 1.5rem;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: .5rem;
  margin-inline-end: auto;
  font-weight: 700;
  letter-spacing: -.01em;
}

.brand .crud {
  display: inline-flex;
  gap: .18rem;
  font-family: var(--f-mono);
  font-size: .78rem;
  font-weight: 600;
  color: var(--accent);
}

.brand .crud span {
  display: inline-grid;
  place-items: center;
  width: 1.35rem;
  height: 1.35rem;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: 4px;
  background: var(--accent-wash);
}

.brand b { font-size: 1rem; }

/* --- segmented switches -------------------------------------------------- */
.switch {
  display: flex;
  align-items: center;
  gap: .5rem;
}

.switch > .lbl {
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.seg {
  display: inline-flex;
  padding: 2px;
  background: var(--surface-2);
  border-radius: 8px;
}

.seg button {
  padding: .35rem .8rem;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink-soft);
  font-family: inherit;
  font-size: .85rem;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s, color .15s;
}

.seg button:hover { color: var(--ink); }

.seg button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--accent-ink);
  font-weight: 700;
  box-shadow: var(--shadow);
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink-soft);
  font-size: .95rem;
  cursor: pointer;
}

.icon-btn:hover { color: var(--accent-ink); border-color: var(--accent); }

:where(button, a):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* --- shell --------------------------------------------------------------- */
.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  align-items: start;
  gap: 2.5rem;
  max-width: 74rem;
  margin: 0 auto;
  padding: 2rem 1.5rem 5rem;
}

/* --- watermark -----------------------------------------------------------
   Faint, repeated, and behind everything the reader touches. It cannot be
   selected or clicked, so it never gets in the way — it only rides along
   into a screenshot or a printout.
   ------------------------------------------------------------------------ */
.watermark {
  position: fixed;
  inset: -30%;
  z-index: 5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.6rem;
  overflow: hidden;
  transform: rotate(-24deg);
  opacity: var(--wm-alpha);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: .05em;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.watermark span { display: block; text-align: center; }

/* --- notice ------------------------------------------------------------- */
.notice {
  grid-column: 1 / -1;
  display: flex;
  gap: .7rem;
  padding: .85rem 1.15rem;
  border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  border-inline-start: 4px solid var(--warn);
  border-radius: 10px;
  background: var(--warn-wash);
  color: var(--warn);
  font-family: var(--f-ui);
  font-size: .9rem;
  font-weight: 500;
  line-height: 1.75;
  white-space: pre-line;
}

.notice .mark { flex: none; font-size: 1.05rem; line-height: 1.5; }

/* --- rail ---------------------------------------------------------------- */
.rail {
  position: sticky;
  top: 4.5rem;
  max-height: calc(100vh - 6rem);
  overflow-y: auto;
  padding-inline-end: .5rem;
}

.rail h2 {
  margin: 0 0 .75rem;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.toc { display: flex; flex-direction: column; gap: .1rem; }

.toc a {
  display: block;
  padding: .3rem .55rem;
  border-inline-start: 2px solid transparent;
  border-radius: 0 5px 5px 0;
  color: var(--ink-soft);
  font-size: .85rem;
  line-height: 1.45;
  text-decoration: none;
}

.toc a:hover { background: var(--surface-2); color: var(--ink); }

.toc a.lvl-1 { font-weight: 600; color: var(--ink); margin-top: .45rem; }
.toc a.lvl-2 { padding-inline-start: 1.1rem; }
.toc a.lvl-3 { padding-inline-start: 1.9rem; font-size: .8rem; color: var(--ink-faint); }

.toc a.here {
  border-inline-start-color: var(--accent);
  background: var(--accent-wash);
  color: var(--accent-ink);
}

/* --- reader -------------------------------------------------------------- */
.reader {
  max-width: var(--measure);
  padding: 2.25rem 2.5rem 3rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 12px;
  box-shadow: var(--shadow);
}

[dir="rtl"] .reader { font-family: var(--f-ar); line-height: 1.95; }
[dir="ltr"] .reader { font-family: var(--f-la); line-height: 1.7; }

.reader h1, .reader h2, .reader h3 {
  font-family: var(--f-ui);
  text-wrap: balance;
  scroll-margin-top: 5rem;
}

.reader h1 {
  margin: 2.5rem 0 1rem;
  padding-bottom: .6rem;
  border-bottom: 2px solid var(--accent);
  font-size: 1.7rem;
  line-height: 1.4;
  letter-spacing: -.01em;
}

.reader > h1:first-child { margin-top: 0; }

.reader h2 {
  margin: 2.25rem 0 .75rem;
  font-size: 1.2rem;
  line-height: 1.5;
  color: var(--accent-ink);
}

.reader h3 {
  margin: 1.75rem 0 .5rem;
  font-size: 1rem;
  color: var(--ink);
}

.reader p { margin: 0 0 1rem; }

.reader ul, .reader ol { margin: 0 0 1rem; padding-inline-start: 1.5rem; }
.reader li { margin-bottom: .4rem; }
[dir="rtl"] .reader ol { list-style-type: arabic-indic; }

.reader a { color: var(--accent-ink); text-underline-offset: .18em; }

.reader hr {
  margin: 2.5rem 0;
  border: 0;
  border-top: 1px solid var(--rule);
}

.reader code {
  padding: .12em .38em;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--accent-ink);
  font-family: var(--f-mono);
  font-size: .85em;
  direction: ltr;
  unicode-bidi: embed;
}

/* --- code blocks --------------------------------------------------------- */
.block {
  position: relative;
  margin: 0 0 1.25rem;
  direction: ltr;
}

.block pre {
  margin: 0;
  padding: 1rem 1.15rem;
  overflow-x: auto;
  background: var(--code-bg);
  border-radius: 10px;
  color: var(--code-ink);
  font-family: var(--f-mono);
  font-size: .82rem;
  line-height: 1.65;
  tab-size: 4;
}

.block pre code {
  padding: 0;
  background: none;
  color: inherit;
  font-size: inherit;
}

.copy {
  position: absolute;
  inset-block-start: .5rem;
  inset-inline-end: .5rem;
  padding: .25rem .6rem;
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 6px;
  background: rgba(255, 255, 255, .07);
  color: #cfe2e8;
  font-family: var(--f-ui);
  font-size: .72rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s;
}

.block:hover .copy, .copy:focus-visible { opacity: 1; }
.copy[data-done="1"] { color: #8fe3c8; border-color: #8fe3c8; }

/* --- tables -------------------------------------------------------------- */
.table-wrap { margin: 0 0 1.25rem; overflow-x: auto; }

.reader table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--f-ui);
  font-size: .88rem;
  font-variant-numeric: tabular-nums;
}

.reader th, .reader td {
  padding: .55rem .8rem;
  border-bottom: 1px solid var(--rule);
  text-align: start;
  vertical-align: top;
}

.reader thead th {
  border-bottom: 2px solid var(--rule);
  color: var(--ink-faint);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
}

.reader tbody tr:last-child td { border-bottom: 0; }

/* --- callouts ------------------------------------------------------------ */
.reader blockquote {
  margin: 0 0 1.25rem;
  padding: .9rem 1.15rem;
  border-inline-start: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  background: var(--accent-wash);
  color: var(--ink-soft);
  font-size: .93em;
}

[dir="rtl"] .reader blockquote { border-radius: 8px 0 0 8px; }

.reader blockquote > :last-child { margin-bottom: 0; }

.reader blockquote:has(h3) {
  border-inline-start-color: var(--warn);
  background: var(--warn-wash);
}

.reader blockquote h3 {
  margin-top: 0;
  color: var(--warn);
  font-size: .95rem;
}

/* --- loading / failed ---------------------------------------------------- */
.state {
  margin: 0;
  padding: 3rem 0;
  color: var(--ink-faint);
  font-family: var(--f-ui);
  text-align: center;
}

/* --- toast --------------------------------------------------------------- */
.toast {
  position: fixed;
  inset-block-end: 1.5rem;
  inset-inline: 0;
  z-index: 40;
  width: max-content;
  max-width: min(90vw, 30rem);
  margin: 0 auto;
  padding: .8rem 1.25rem;
  border-radius: 10px;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--f-ui);
  font-size: .88rem;
  font-weight: 500;
  text-align: center;
  box-shadow: 0 8px 30px -10px rgba(0, 0, 0, .5);
}

/* --- small screens ------------------------------------------------------- */
@media (max-width: 60rem) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 1.25rem; padding-top: 1.25rem; }
  .rail {
    position: static;
    max-height: 18rem;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
  }
  .reader { padding: 1.5rem 1.25rem 2rem; }
  .topbar { gap: .6rem 1rem; padding: .6rem 1rem; }
  .brand .crud { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* --- print --------------------------------------------------------------- */
@media print {
  .topbar, .rail, .copy, .toast { display: none !important; }
  .notice { margin-bottom: 1.25rem; border-color: #b8791f; color: #8a5a12; background: #fbf3e6; }
  .watermark { opacity: .05; color: #12303a; }
  body { background: #fff; }
  .shell { display: block; max-width: none; padding: 0; }
  .reader {
    max-width: none;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    padding: 0;
    font-size: 11pt;
  }
  .block pre { background: #f2f4f6; color: #10202a; border: 1px solid #ccd6de; }
  .block, .table-wrap, blockquote { break-inside: avoid; }
  .reader h1, .reader h2, .reader h3 { break-after: avoid; }
}
</style>

<div class="app" dir="rtl">

  <div class="watermark" id="watermark" hidden aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <header class="topbar">
    <div class="brand">
      <span class="crud" aria-hidden="true"><span>C</span><span>R</span><span>U</span><span>D</span></span>
      <b data-t="brand">ڕێنمایی قوتابی</b>
    </div>

    <div class="switch">
      <span class="lbl" data-t="langLabel">زمان</span>
      <div class="seg" id="langSeg" role="group">
        <button type="button" data-lang="ku" aria-pressed="true">کوردی</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>

    <button type="button" class="icon-btn" id="themeBtn" title="Theme" aria-label="Theme">◐</button>
    <button type="button" class="icon-btn" id="printBtn" title="Print" aria-label="Print">⎙</button>
  </header>

  <div class="shell">
    <div class="notice" id="notice" hidden>
      <span class="mark" aria-hidden="true">⚠️</span>
      <span class="text"></span>
    </div>

    <nav class="rail" aria-label="Contents">
      <h2 data-t="tocLabel">ناوەڕۆک</h2>
      <div class="toc" id="toc"></div>
    </nav>
    <main class="reader" id="reader"></main>
  </div>

</div>

<script type="application/json" id="docs-data">{}</script>
<script>
(function () {
  "use strict";

  var DOCS = JSON.parse(document.getElementById("docs-data").textContent);

  /* On the hosted page the guide is not in this file — it is fetched, so a
     saved copy of the page is an empty shell. Offline builds ship the text
     inside DOCS and leave FETCH null. */
  var FETCH = {"ku": "ku.md", "en": "en.md"};

  var UI = {
    ku: { brand: "ڕێنمایی قوتابی", langLabel: "زمان", tocLabel: "ناوەڕۆک",
          copy: "کۆپی", copied: "کۆپی کرا",
          keep: "بۆ هێشتنەوەی کۆپییەک، Ctrl + P دابگرە و وەک PDF چاپی بکە",
          loading: "دەقەکە دەهێنرێت…",
          failed: "نەتوانرا دەقەکە بهێنرێت. پەیوەندی ئینتەرنێتەکەت بپشکنە و لاپەڕەکە دووبارە بارکە." },
    en: { brand: "Student Guide", langLabel: "Language", tocLabel: "Contents",
          copy: "Copy", copied: "Copied",
          keep: "To keep a copy, press Ctrl + P and print to PDF",
          loading: "Loading the text…",
          failed: "The text could not be loaded. Check your connection and reload the page." }
  };

  var STORE = "studentGuide";
  var NOTICE_KU = "ئەم وەشانە کوردییە تەنها بۆ تێگەیشتنی خۆتە.\nتاقیکردنەوە و وەڵامدانەوە تەنها لەسەر وەشانی ئینگلیزییە.";
  var MARK_KU = "تەنها بۆ تێگەیشتن — وەڵامدانەوە بە ئینگلیزییە";
  var state = { lang: "ku" };

  /* ---- storage is a convenience, never a requirement -------------------- */
  function remember(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }
  function recall(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  /* ---- markdown ---------------------------------------------------------
     A small parser, written out in full so the page works with no network
     and no library — the same rule the project itself follows.            */

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function (m, c) { return "<code>" + c + "</code>"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
      var ext = /^https?:/.test(u);
      return '<a href="' + u + '"' + (ext ? ' target="_blank" rel="noopener"' : "") + ">" + t + "</a>";
    });
    s = s.replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  var LIST_ORDERED = /^[0-9٠-٩۰-۹]+[.)]\s+/;
  var LIST_BULLET = /^[-*]\s+/;

  function render(md, headings) {
    var lines = md.replace(/\r\n/g, "\n").split("\n");
    var out = [];
    var i = 0;
    var para = [];

    function flushPara() {
      if (para.length) {
        out.push("<p>" + inline(para.join(" ")) + "</p>");
        para = [];
      }
    }

    while (i < lines.length) {
      var line = lines[i];

      /* fenced code */
      if (/^```/.test(line)) {
        flushPara();
        var lang = line.slice(3).trim();
        var code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        out.push('<div class="block"><button type="button" class="copy">' + UI[state.lang].copy +
          '</button><pre><code data-lang="' + esc(lang) + '">' + esc(code.join("\n")) + "</code></pre></div>");
        continue;
      }

      /* table */
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        flushPara();
        var cells = function (row) {
          return row.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
        };
        var head = cells(line);
        i += 2;
        var body = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { body.push(cells(lines[i])); i++; }
        var t = "<div class='table-wrap'><table><thead><tr>";
        head.forEach(function (c) { t += "<th>" + inline(c) + "</th>"; });
        t += "</tr></thead><tbody>";
        body.forEach(function (row) {
          t += "<tr>";
          row.forEach(function (c) { t += "<td>" + inline(c) + "</td>"; });
          t += "</tr>";
        });
        out.push(t + "</tbody></table></div>");
        continue;
      }

      /* heading */
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) {
        flushPara();
        var level = h[1].length;
        var id = "h" + headings.length;
        headings.push({ id: id, level: level, text: h[2].replace(/[*`]/g, "") });
        out.push("<h" + level + ' id="' + id + '">' + inline(h[2]) + "</h" + level + ">");
        i++;
        continue;
      }

      /* horizontal rule */
      if (/^\s*(---|\*\*\*)\s*$/.test(line)) {
        flushPara();
        out.push("<hr>");
        i++;
        continue;
      }

      /* blockquote — collected, then parsed as a document of its own */
      if (/^\s*>/.test(line)) {
        flushPara();
        var quoted = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          quoted.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push("<blockquote>" + render(quoted.join("\n"), headings) + "</blockquote>");
        continue;
      }

      /* lists */
      if (LIST_BULLET.test(line) || LIST_ORDERED.test(line)) {
        flushPara();
        var ordered = LIST_ORDERED.test(line);
        var items = [];
        while (i < lines.length && (LIST_BULLET.test(lines[i]) || LIST_ORDERED.test(lines[i]))) {
          items.push(lines[i].replace(ordered ? LIST_ORDERED : LIST_BULLET, ""));
          i++;
          /* a wrapped continuation line belongs to the item above it */
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) &&
                 !LIST_BULLET.test(lines[i].trim()) && !LIST_ORDERED.test(lines[i].trim())) {
            items[items.length - 1] += " " + lines[i].trim();
            i++;
          }
        }
        var tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map(function (it) {
          return "<li>" + inline(it) + "</li>";
        }).join("") + "</" + tag + ">");
        continue;
      }

      if (!line.trim()) { flushPara(); i++; continue; }

      para.push(line.trim());
      i++;
    }

    flushPara();
    return out.join("\n");
  }

  /* ---- painting ---------------------------------------------------------- */
  var reader = document.getElementById("reader");
  var notice = document.getElementById("notice");
  var watermark = document.getElementById("watermark");
  var toc = document.getElementById("toc");
  var app = document.querySelector(".app");

  function paint() {
    if (DOCS[state.lang] === undefined && FETCH && FETCH[state.lang]) {
      return fetchGuide(state.lang);
    }

    var md = DOCS[state.lang] || "";
    var headings = [];
    var rtl = state.lang === "ku";

    app.setAttribute("dir", rtl ? "rtl" : "ltr");
    document.documentElement.lang = rtl ? "ckb" : "en";

    /* the Kurdish text is a translation to read alongside, not the one
       the student is examined on — say so, and only while it is showing */
    if (NOTICE_KU && state.lang === "ku") {
      notice.querySelector(".text").textContent = NOTICE_KU;
      notice.hidden = false;
    } else {
      notice.hidden = true;
    }

    if (MARK_KU && state.lang === "ku") {
      if (!watermark.childNodes.length) {
        var row = new Array(8).join(MARK_KU + "   ·   ");
        for (var r = 0; r < 30; r++) {
          var line = document.createElement("span");
          line.textContent = row;
          watermark.appendChild(line);
        }
      }
      watermark.hidden = false;
    } else {
      watermark.hidden = true;
    }

    reader.innerHTML = render(md, headings);
    reader.scrollIntoView({ block: "start" });
    window.scrollTo(0, 0);

    /* labels follow the reading language */
    var words = UI[state.lang];
    document.querySelectorAll("[data-t]").forEach(function (el) {
      var w = words[el.getAttribute("data-t")];
      if (w) { el.textContent = w; }
    });

    /* contents */
    toc.innerHTML = "";
    headings.filter(function (h) { return h.level <= 3; }).forEach(function (h) {
      var a = document.createElement("a");
      a.href = "#" + h.id;
      a.className = "lvl-" + h.level;
      a.textContent = h.text;
      toc.appendChild(a);
    });

    /* switch states */
    document.querySelectorAll("#langSeg button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang));
    });

    spy();
  }

  /* ---- fetching the text ------------------------------------------------ */
  function fetchGuide(lang) {
    var words = UI[lang];
    reader.innerHTML = '<p class="state">' + words.loading + "</p>";
    fetch(FETCH[lang], { cache: "no-cache" }).then(function (response) {
      if (!response.ok) { throw new Error(response.status); }
      return response.text();
    }).then(function (text) {
      DOCS[lang] = text;
      paint();
    })["catch"](function () {
      reader.innerHTML = '<p class="state">' + words.failed + "</p>";
    });
  }

  /* ---- which section am I in? ------------------------------------------- */
  var spyTimer = null;
  function spy() {
    var links = toc.querySelectorAll("a");
    var current = null;
    reader.querySelectorAll("h1, h2, h3").forEach(function (h) {
      if (h.getBoundingClientRect().top < 120) { current = h.id; }
    });
    links.forEach(function (a) {
      a.classList.toggle("here", a.getAttribute("href") === "#" + current);
    });
  }

  window.addEventListener("scroll", function () {
    if (spyTimer) { return; }
    spyTimer = setTimeout(function () { spyTimer = null; spy(); }, 120);
  }, { passive: true });

  /* ---- controls ---------------------------------------------------------- */
  document.getElementById("langSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { return; }
    state.lang = b.dataset.lang;
    remember(STORE + ".lang", state.lang);
    paint();
  });

  document.getElementById("themeBtn").addEventListener("click", function () {
    var now = document.documentElement.getAttribute("data-theme");
    var dark = now
      ? now === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    remember("guide.theme", next);
  });

  document.getElementById("printBtn").addEventListener("click", function () {
    window.print();
  });

  reader.addEventListener("click", function (e) {
    var btn = e.target.closest(".copy");
    if (!btn) { return; }
    var code = btn.parentElement.querySelector("code");
    var done = function () {
      btn.textContent = UI[state.lang].copied;
      btn.dataset.done = "1";
      setTimeout(function () {
        btn.textContent = UI[state.lang].copy;
        btn.dataset.done = "";
      }, 1400);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code.textContent).then(done, function () { /* ignore */ });
    } else {
      var sel = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(code);
      sel.removeAllRanges();
      sel.addRange(range);
      done();
    }
  });

  /* ---- saving the page is not the path; printing to PDF is ---------------
     A browser menu can still save the file — this only turns the usual
     shortcuts towards the copy we want the student to make.              */
  var toast = document.getElementById("toast");
  var toastTimer = null;

  function hint(text) {
    toast.textContent = text;
    toast.hidden = false;
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { toast.hidden = true; }, 3200);
  }

  document.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) { return; }
    var key = (e.key || "").toLowerCase();
    if (key === "s" || key === "u") {
      e.preventDefault();
      hint(UI[state.lang].keep);
    }
  });

  document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    hint(UI[state.lang].keep);
  });

  /* ---- copied Kurdish text carries the notice with it --------------------
     Code is left alone: a notice pasted into a .py file would break it.   */
  document.addEventListener("copy", function (e) {
    if (!NOTICE_KU || state.lang !== "ku" || !e.clipboardData) { return; }

    var sel = window.getSelection();
    var text = sel ? String(sel) : "";
    if (!text.trim()) { return; }

    var node = sel.anchorNode;
    if (node && node.nodeType === 3) { node = node.parentNode; }
    if (node && node.closest && node.closest("pre")) { return; }

    var rule = new Array(34).join("─");
    e.clipboardData.setData("text/plain",
      text + "\n\n" + rule + "\n" + NOTICE_KU);
    e.preventDefault();
  });

  /* ---- start ------------------------------------------------------------- */
  var savedTheme = recall("guide.theme");
  if (savedTheme) { document.documentElement.setAttribute("data-theme", savedTheme); }
  var savedLang = recall(STORE + ".lang");
  if (savedLang === "ku" || savedLang === "en") { state.lang = savedLang; }

  paint();
})();
</script>
<!-- ARTIFACT:END -->
</body>
</html>
